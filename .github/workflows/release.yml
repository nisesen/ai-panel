name: Release

# A version tag (v1.2.3) publishes the image ghcr.io/<owner>/ai-panel for amd64 and arm64, with
# an SBOM and build provenance. Only a commit on main whose CI passed is published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    name: Publish the image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      actions: read # to read CI's result for this commit
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag is the version, on main, and CI passed for its commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, code $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }
          ci=$(gh run list --workflow CI --branch main --commit "$GITHUB_SHA" --event push \
            --json conclusion --jq '.[0].conclusion')
          test "$ci" = success || { echo "CI on $GITHUB_SHA: ${ci:-not run}"; exit 1; }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-panel
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ai-panel
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: The published image runs on both architectures
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ai-panel@${{ steps.build.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" "$IMAGE" --version
          done
