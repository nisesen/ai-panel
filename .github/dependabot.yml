version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new Python is a project change (pyproject.toml, .python-version, CI), not a bump.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
